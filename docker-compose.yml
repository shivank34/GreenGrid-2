services:
  postgres:
    image: postgres:16-alpine
    container_name: greengrid-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: greengrid_db
    ports:
      - "5432:5432"
    volumes:
      - greengrid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greengrid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: greengrid-adminer
    restart: always
    ports:
      - "8085:8080"
    depends_on:
      - postgres

volumes:
  greengrid_pgdata:
    driver: local
